[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "eigentrail"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.3,<3"]
description = "TRACE covariance trajectories with independent numerical checking"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Bontemps", email = "gbontemps@protonmail.com" }]
maintainers = [{ name = "Gabriel Bontemps", email = "gbontemps@protonmail.com" }]
keywords = ["covariance", "eigenvalues", "eigenspaces", "uncertainty"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.readme]
content-type = "text/markdown"
text = """
# EigenTrail

EigenTrail tracks covariance eigenvalues and eigenspaces over time with the
TRACE method. It provides uncertainty bounds, persistent associations and
continuous-history summaries with an independent Rust numerical checker.

Python inputs are NumPy float64 arrays with shape `(dates, features, features)`.
Sampling and path-regularity assumptions remain explicit; unresolved results
retain their alternatives. Computation and checking run locally.

Requires CPython 3.14 with NumPy >=2.3,<3, Rust 1.99.0 and native C/C++ build
tools. Supports macOS ARM64 and GNU/Linux x86-64 with Haswell/x86-64-v3 CPU
instructions and operating-system support.

Install from GitHub in an activated virtual environment:

```sh
python -m pip install "eigentrail @ git+https://github.com/TrompetteMarine/EigenTrail.git#subdirectory=python"
```

On Linux, set `RUSTFLAGS="-C target-cpu=haswell"` before source installation.

[Quickstart](https://github.com/TrompetteMarine/EigenTrail/blob/main/docs/quickstart.md)
| [Source](https://github.com/TrompetteMarine/EigenTrail)
| [Issues](https://github.com/TrompetteMarine/EigenTrail/issues)

First-party code is MIT licensed. Distributed packages include the required
third-party license and copyright notices.
"""

[project.urls]
Homepage = "https://github.com/TrompetteMarine/EigenTrail"
Source = "https://github.com/TrompetteMarine/EigenTrail"
Documentation = "https://github.com/TrompetteMarine/EigenTrail/blob/main/docs/quickstart.md"
Issues = "https://github.com/TrompetteMarine/EigenTrail/issues"

[tool.maturin]
manifest-path = "../crates/eigentrail-python/Cargo.toml"
python-source = "."
module-name = "eigentrail._eigentrail"
include = [{ path = "eigentrail/_licenses/**/*", format = ["wheel", "sdist"] }]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
