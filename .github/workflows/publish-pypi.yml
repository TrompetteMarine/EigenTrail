name: Publish qualified Python release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing qualified GitHub release tag
        required: true
        type: string
      expected_sha:
        description: Exact qualified release commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/eigentrail
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Verify tag, release and qualified artifact manifest
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" == "$EXPECTED_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release-state.json
          gh release download "$RELEASE_TAG" --dir qualified
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('release-state.json').read_text())
          assert not state['isDraft'] and not state['isPrerelease']
          PY
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('python/pyproject.toml').read_text())['project']
          assert os.environ['RELEASE_TAG'] == 'v' + project['version']
          PY
          python scripts/test_qualified_artifacts.py
          python scripts/qualified_artifacts.py --directory qualified --project python/pyproject.toml --commit "$EXPECTED_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --out dist > selected-artifacts.json
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          arguments = [part for path in sorted(Path('dist').iterdir())
                       for part in ['--artifact', str(path)]]
          subprocess.run([sys.executable, 'scripts/check_release.py', *arguments], check=True)
          PY
      - name: Publish exact qualified bytes through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
