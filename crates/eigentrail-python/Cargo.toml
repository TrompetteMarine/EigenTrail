[package]
name = "eigentrail-python"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Python bindings for EigenTrail covariance trajectories"
publish = false

[lib]
name = "_eigentrail"
crate-type = ["cdylib"]

[dependencies]
eigentrail-core.workspace = true
eigentrail-check.workspace = true
serde_json.workspace = true
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
numpy = "=0.30.0"

[build-dependencies]
pyo3-build-config = "=0.30.1"
