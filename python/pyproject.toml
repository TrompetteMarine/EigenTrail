[build-system]
requires = ["maturin==1.9.6"]
build-backend = "maturin"

[project]
name = "eigentrail"
version = "0.3.0"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2.3,<3"]
description = "TRACE covariance trajectories with independent numerical checking"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel Bontemps", email = "gbontemps@protonmail.com" }]
maintainers = [{ name = "Gabriel Bontemps", email = "gbontemps@protonmail.com" }]
keywords = ["covariance", "eigenvalues", "eigenspaces", "uncertainty"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Operating System :: MacOS :: MacOS X",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.readme]
content-type = "text/markdown"
text = """
# EigenTrail

EigenTrail tracks covariance eigenvalues and eigenspaces over time with TRACE,
using Rust producers and independent numerical checking. Candidate **0.3.0** adds
observed-date rolling lineage, founder reach and optional plotting. Tied groups,
explicit missing slots, unavailable transfers and unresolved bounds stay visible.
Statistical conclusions require the caller's declared joint event and premises.

This is an **unreleased candidate**. PyPI still distributes Python **0.2.0**;
GitHub's latest published release is **v0.2.2** for R maintenance. No 0.3.0 tag or
registry publication is implied. Candidate installation requires a receipt for
the exact artifact digest and OS/architecture/ABI/CPU tuple.

Python receives real NumPy float64 arrays with shape `(dates, features, features)`.
CPython **3.14** and NumPy **>=2.3,<3** are required. The optional `plot` extra adds
Matplotlib **>=3.10,<4**; plots work offline without TeX. A built wheel needs no
Rust toolchain. Source installation requires Rust **1.99.0** and native C/C++ tools.

After the candidate wheel is qualified for macOS ARM64/CPython 3.14, install its
verified local bytes in an activated virtual environment:

```sh
python -m pip install --only-binary=:all: "./candidate/eigentrail-0.3.0-cp314-cp314-macosx_14_0_arm64.whl[plot]"
```

A separately qualified source archive is installed with:

```sh
python -m pip install "./candidate/eigentrail-0.3.0.tar.gz[plot]"
```

The public Linux workspace now stages the preserved baseline SSE2 interval fork
with `RUSTFLAGS="-C target-cpu=x86-64"`, `CFLAGS="-march=x86-64"` and matching
CXXFLAGS. Generic Linux wheels remain held until native baseline, manylinux,
independent endpoint and scientific checks pass. Windows MSVC/Haswell candidates
need their own backend, helper/DLL and installed-artifact qualification; Windows
source installation remains unqualified until its helper-build route is checked.

For the **earlier published Python 0.2.0** API, use:

```sh
python -m pip install --only-binary=eigentrail "eigentrail==0.2.0"
```

That release's Linux source builds retain their original Haswell/OS-AVX
requirements. The new rolling API is available only in a qualified 0.3.0 candidate.

[Quickstart](https://github.com/TrompetteMarine/EigenTrail/blob/main/docs/quickstart.md)
| [Source](https://github.com/TrompetteMarine/EigenTrail)
| [Issues](https://github.com/TrompetteMarine/EigenTrail/issues)

First-party code is MIT licensed. Distributed packages include dependency notices.

"""

[project.optional-dependencies]
plot = ["matplotlib>=3.10,<4"]

[project.urls]
Homepage = "https://github.com/TrompetteMarine/EigenTrail"
Source = "https://github.com/TrompetteMarine/EigenTrail"
Documentation = "https://github.com/TrompetteMarine/EigenTrail/blob/main/docs/quickstart.md"
Issues = "https://github.com/TrompetteMarine/EigenTrail/issues"

[tool.maturin]
manifest-path = "../crates/eigentrail-python/Cargo.toml"
python-source = "."
module-name = "eigentrail._eigentrail"
include = [
    { path = "eigentrail/_licenses/**/*", format = ["wheel", "sdist"] },
    { path = "eigentrail/_eigentrail_cpu_guard.dll", format = "wheel" },
]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/*.pyo"]
